
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-grounded-chat"
version = "0.1.0"
description = "Build a grounded chat layer on top of curated content with simple retrieval and answer generation."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
